<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimFic</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #d4f5e0 0%, #b8ecd0 35%, #c5e8d8 60%, #d0e8f0 100%);
  color: #2a4a3a;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #d4f5e0; }
::-webkit-scrollbar-thumb { background: #4eca7a; border-radius: 20px; }

.page { display: none; max-width: 720px; margin: 0 auto; padding: 40px 20px; }
.page.active { display: block; }

h1, h2, h3 { font-family: 'Quicksand', sans-serif; color: #2DB84B; }

label {
  display: block;
  font-size: 0.82em;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #5a8a6a;
  margin-bottom: 6px;
  font-weight: 600;
}

input[type="text"], textarea {
  width: 100%;
  background: #fff;
  border: 2px solid #a0dbb0;
  border-radius: 16px;
  color: #2a4a3a;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  font-size: 0.95em;
  line-height: 1.6;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="text"]:focus, textarea:focus { border-color: #28a745; box-shadow: 0 0 0 3px rgba(40,167,69,0.15); }
textarea { resize: vertical; }
input.sample-text, textarea.sample-text { color: #8abba0; font-style: italic; }

.field { margin-bottom: 20px; }

.btn-gold {
  background: linear-gradient(135deg, #4eca7a, #28a745);
  color: #fff;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  border: none;
  border-radius: 24px;
  padding: 12px 28px;
  cursor: pointer;
  font-size: 0.95em;
  transition: filter 0.2s, transform 0.1s;
  box-shadow: 0 4px 14px rgba(40,167,69,0.25);
}
.btn-gold:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-gold:disabled { opacity: 0.4; cursor: default; filter: none; transform: none; }

.btn-secondary {
  background: #fff;
  color: #2DB84B;
  border: 2px solid #a0dbb0;
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.9em;
  font-weight: 600;
  transition: background 0.2s, border-color 0.2s;
}
.btn-secondary:hover { background: #d4f5e0; border-color: #4eca7a; }

.btn-ghost {
  background: transparent;
  border: none;
  color: #6aaa7a;
  cursor: pointer;
  font-size: 1.1em;
  padding: 4px 8px;
  transition: color 0.2s;
}
.btn-ghost:hover { color: #28a745; }

.btn-danger {
  background: #fde2e2;
  color: #c0392b;
  border: 2px solid #f5a5a5;
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.9em;
  font-weight: 600;
}
.btn-danger:hover { background: #fcc; border-color: #e74c3c; }

/* Home Page */
#home-page { padding-top: 60px; position: relative; overflow: hidden; }
#home-page h1 { text-align: center; margin-bottom: 8px; font-size: 2.2em; }
.home-subtitle { text-align: center; color: #5a8a6a; margin-bottom: 40px; font-style: italic; }

/* Floating decorations */
.decor-bubble {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(122,219,160,0.2));
  border: 1.5px solid rgba(255,255,255,0.5);
  pointer-events: none;
  z-index: 0;
  animation: float-bubbles 6s ease-in-out infinite;
  will-change: transform;
  box-shadow: 0 2px 8px rgba(122,219,160,0.15), inset 0 -2px 6px rgba(255,255,255,0.3);
}
.decor-bubble-slow {
  position: absolute;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 25%, rgba(255,255,255,0.5), rgba(78,202,122,0.12));
  border: 1px solid rgba(255,255,255,0.35);
  pointer-events: none;
  z-index: 0;
  animation: float-bubbles-slow 9s ease-in-out infinite;
  will-change: transform;
  box-shadow: 0 2px 12px rgba(122,219,160,0.1);
}
.decor-sparkle, .decor-flower {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  opacity: 0.6;
  animation: sparkle-drift 4s ease-in-out infinite;
  will-change: transform;
}
.decor-emoji {
  position: absolute;
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
  animation: emoji-float 7s ease-in-out infinite;
  will-change: transform;
  font-size: 1.2em;
}
@keyframes float-bubbles {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.8; }
  50% { transform: translateY(-22px) scale(1.08); opacity: 1; }
}
@keyframes float-bubbles-slow {
  0%, 100% { transform: translateY(0) translateX(0) scale(1); opacity: 0.5; }
  33% { transform: translateY(-14px) translateX(6px) scale(1.04); opacity: 0.7; }
  66% { transform: translateY(-8px) translateX(-4px) scale(0.97); opacity: 0.6; }
}
@keyframes sparkle-drift {
  0%, 100% { transform: translateX(0) rotate(0deg); opacity: 0.4; }
  50% { transform: translateX(8px) rotate(10deg); opacity: 0.7; }
}
@keyframes emoji-float {
  0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.3; }
  25% { transform: translateY(-12px) rotate(5deg); opacity: 0.5; }
  50% { transform: translateY(-20px) rotate(-3deg); opacity: 0.4; }
  75% { transform: translateY(-8px) rotate(8deg); opacity: 0.5; }
}

/* Glassmorphism header */
.glass-header {
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 32px;
  padding: 28px 32px 24px;
  text-align: center;
  margin-bottom: 32px;
  position: relative;
  z-index: 1;
  box-shadow: 0 4px 24px rgba(45,184,75,0.08);
}
.glass-header-flowers {
  position: absolute;
  top: -14px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.4em;
  filter: drop-shadow(0 2px 4px rgba(45,184,75,0.2));
}

/* Story card tags */
.story-card-tags { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.tag-fandom {
  display: inline-flex; align-items: center; gap: 4px;
  background: #d4f5e0; color: #2DB84B;
  border-radius: 20px; padding: 3px 12px;
  font-size: 0.78em; font-weight: 600;
  font-family: 'Quicksand', sans-serif;
}
.tag-tone {
  display: inline-flex; align-items: center; gap: 4px;
  background: #d0e8f0; color: #3a7a9a;
  border-radius: 20px; padding: 3px 12px;
  font-size: 0.78em; font-weight: 600;
  font-family: 'Quicksand', sans-serif;
}

/* Pack selector */
.pack-selector { margin-top: 8px; }
.pack-group-label {
  font-size: 0.82em; font-weight: 700; color: #5a8a6a;
  margin: 10px 0 6px; display: flex; align-items: center; gap: 8px;
  font-family: 'Quicksand', sans-serif;
}
.pack-group-label button {
  font-size: 0.85em; padding: 2px 10px; border-radius: 12px;
  border: 1px solid #2DB84B; background: transparent; color: #2DB84B;
  cursor: pointer; font-family: 'Quicksand', sans-serif; font-weight: 600;
}
.pack-group-label button:hover { background: #d4f5e0; }
.pack-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.pack-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 5px 14px; border-radius: 20px;
  font-size: 0.78em; font-weight: 600;
  font-family: 'Quicksand', sans-serif;
  cursor: pointer; user-select: none;
  border: 1.5px solid #c0d8c8; background: #f5faf7; color: #6a9a7a;
  transition: all 0.15s ease;
}
.pack-chip.selected {
  background: #2DB84B; color: #fff; border-color: #2DB84B;
  box-shadow: 0 2px 8px rgba(45,184,75,0.25);
}
.pack-chip:hover { border-color: #2DB84B; }

/* Story card controls wrapper */
.story-card-controls { display: flex; align-items: center; gap: 10px; }

/* Holographic button */
@keyframes holographic-shimmer {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
@keyframes holographic-shine {
  0% { left: -100%; }
  100% { left: 200%; }
}
.btn-holographic {
  background: linear-gradient(135deg, #2DB84B, #20c997, #17a2b8, #4eca7a, #2DB84B);
  background-size: 300% 300%;
  animation: holographic-shimmer 4s ease infinite;
  color: #fff;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  border: none;
  border-radius: 24px;
  padding: 14px 32px;
  cursor: pointer;
  font-size: 1em;
  position: relative;
  overflow: hidden;
  box-shadow: 0 4px 18px rgba(45,184,75,0.3);
  transition: transform 0.1s;
}
.btn-holographic:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(45,184,75,0.4); }
.btn-holographic::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: holographic-shine 3s ease-in-out infinite;
}

.story-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; position: relative; z-index: 1; }
.story-card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 20px;
  padding: 20px 24px;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 12px rgba(45,184,75,0.08);
}
.story-card:hover { border-color: rgba(78,202,122,0.5); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(45,184,75,0.15); }
.story-card-info { flex: 1; min-width: 0; }
.story-card-title {
  font-family: 'Quicksand', sans-serif;
  font-size: 1.1em;
  font-weight: 700;
  color: #1a3a2a;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.story-card-meta {
  font-size: 0.82em;
  color: #5a8a6a;
  font-style: italic;
}
.story-card-chapters {
  font-size: 0.8em;
  color: #6aaa7a;
  margin-top: 6px;
}
.story-card-chevron {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: linear-gradient(135deg, #4eca7a, #28a745);
  color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.2em;
  border: none;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  flex-shrink: 0;
}
.story-card-chevron:hover { transform: scale(1.1); box-shadow: 0 3px 12px rgba(40,167,69,0.3); }

.story-card-actions {
  display: flex; gap: 4px; margin-left: 12px;
  background: #2d2b3a;
  border-radius: 20px;
  padding: 4px 6px;
}
.story-card-actions button {
  background: transparent;
  border: none;
  color: #b8b5c8;
  cursor: pointer;
  font-size: 0.9em;
  padding: 4px 8px;
  border-radius: 12px;
  transition: color 0.2s, background 0.2s;
}
.story-card-actions button:hover { color: #fff; background: rgba(255,255,255,0.1); }
.story-card-actions .delete-story:hover { color: #e74c3c; background: rgba(231,76,60,0.15); }

/* Scalloped new story section */
.new-story-section {
  position: relative;
  z-index: 1;
  padding: 18px 18px 22px;
  background: linear-gradient(135deg, #7adba0, #4eca7a, #3cb86a, #7adba0);
  border-radius: 28px;
  transition: opacity 0.2s, transform 0.2s;
  box-shadow: 0 6px 24px rgba(45,184,75,0.15);
}
.new-story-section::before {
  content: '💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠';
  position: absolute;
  top: -12px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.85em;
  letter-spacing: 2px;
  line-height: 1;
  pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(45,184,75,0.3));
}
.new-story-section::after {
  content: '💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠💎🏠';
  position: absolute;
  bottom: -12px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 0.85em;
  letter-spacing: 2px;
  line-height: 1;
  pointer-events: none;
  filter: drop-shadow(0 1px 2px rgba(45,184,75,0.3));
}
.new-story-section:hover { opacity: 0.95; transform: scale(1.01); }
.new-story-inner {
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 18px;
  padding: 36px;
  text-align: center;
  border: 2.5px solid rgba(78,202,122,0.5);
  box-shadow: inset 0 0 20px rgba(122,219,160,0.2);
}
.new-story-section h3 {
  font-size: 1.1em;
  margin-bottom: 8px;
  color: #5a8a6a;
}
.new-story-section p {
  font-size: 0.85em;
  color: #6aaa7a;
  margin-bottom: 16px;
}

.home-empty {
  text-align: center;
  padding: 48px 20px;
  color: #6aaa7a;
  position: relative;
  z-index: 1;
}
.home-empty p {
  font-style: italic;
  margin-bottom: 24px;
  font-size: 1.05em;
}

/* Setup Page */
#setup-page h1 { text-align: center; margin-bottom: 8px; font-size: 1.8em; }
.setup-subtitle { text-align: center; color: #5a8a6a; margin-bottom: 36px; font-style: italic; }
.setup-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
.validation-error { color: #28a745; font-size: 0.85em; margin-top: 8px; }

/* Index Page */
.index-topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px; padding-bottom: 16px; border-bottom: 2px solid #a0dbb0;
}
.index-topbar-title h2 { font-size: 1.3em; margin-bottom: 2px; }
.index-topbar-title .fandom { font-size: 0.82em; color: #5a8a6a; font-style: italic; }
.index-topbar-actions { display: flex; gap: 8px; align-items: center; }

.chapter-card {
  background: #fff;
  border: 2px solid #a0dbb0;
  border-radius: 18px;
  padding: 16px 20px;
  margin-bottom: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(45,184,75,0.06);
}
.chapter-card:hover { border-color: #4eca7a; box-shadow: 0 4px 14px rgba(45,184,75,0.12); }
.chapter-card-content { flex: 1; min-width: 0; }
.chapter-card-label { font-size: 0.95em; font-weight: 700; color: #28a745; margin-bottom: 4px; }
.chapter-card-preview { font-size: 0.85em; color: #5a8a6a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-card-arrows { display: flex; flex-direction: column; gap: 2px; margin: 0 12px; }
.chapter-card-arrows button {
  background: transparent; border: none; color: #6aaa7a; cursor: pointer;
  font-size: 0.9em; padding: 2px 6px; line-height: 1;
}
.chapter-card-arrows button:hover { color: #28a745; }
.chapter-card-arrows button:disabled { opacity: 0.2; cursor: default; }
.chapter-card-chevron { color: #6aaa7a; font-size: 1.2em; margin-left: 8px; }

.empty-state { text-align: center; color: #6aaa7a; padding: 48px 20px; font-style: italic; }

.index-bottom { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }

.lore-editor { margin-top: 20px; padding-top: 20px; border-top: 2px solid #a0dbb0; }
.lore-editor textarea { min-height: 100px; }
.lore-toggle { cursor: pointer; color: #5a8a6a; font-size: 0.9em; }
.lore-toggle:hover { color: #28a745; }

/* Lore Entry Fields */
.lore-field { margin-bottom: 16px; }
.lore-field-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 6px;
}
.lore-field-header label { margin-bottom: 0; }
.btn-randomize {
  background: linear-gradient(135deg, #7adba0, #4eca7a);
  color: #fff;
  border: none;
  border-radius: 16px;
  padding: 4px 14px;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.78em;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.2s, transform 0.1s;
  letter-spacing: 0.5px;
}
.btn-randomize:hover { filter: brightness(1.1); transform: translateY(-1px); }
.lore-fields-group { margin-top: 12px; }
.btn-randomize-all {
  background: linear-gradient(135deg, #4eca7a, #28a745);
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 8px 20px;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.85em;
  font-weight: 700;
  cursor: pointer;
  transition: filter 0.2s, transform 0.1s;
  box-shadow: 0 3px 10px rgba(40,167,69,0.2);
  margin-bottom: 16px;
}
.btn-randomize-all:hover { filter: brightness(1.1); transform: translateY(-1px); }

/* Add Chapter Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(45,184,75,0.15); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border: 2px solid #a0dbb0; border-radius: 24px;
  padding: 28px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 32px rgba(45,184,75,0.15);
}
.modal h3 { margin-bottom: 16px; font-size: 1.1em; }
.modal textarea { min-height: 300px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* Chapter View */
.chapter-topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px; padding-bottom: 16px; border-bottom: 2px solid #a0dbb0;
}
.chapter-topbar-center { font-size: 0.82em; text-transform: uppercase; letter-spacing: 1.5px; color: #5a8a6a; }
.chapter-topbar-actions { display: flex; gap: 8px; }

.chapter-heading {
  text-align: center; font-size: 0.85em; text-transform: uppercase;
  letter-spacing: 3px; color: #2DB84B; margin-bottom: 32px;
  font-family: 'Quicksand', sans-serif; font-weight: 700;
}
.chapter-body {
  white-space: pre-wrap; font-size: 0.98em; line-height: 1.9;
  color: #2a4a3a; padding-bottom: 80px;
}

.chapter-edit textarea { min-height: 400px; margin-bottom: 16px; }
.chapter-edit-actions { display: flex; gap: 10px; margin-bottom: 32px; }

.chapter-bottombar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-top: 2px solid #a0dbb0;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px; z-index: 50;
  box-shadow: 0 -2px 12px rgba(45,184,75,0.08);
}
.chapter-bottombar .page-counter { font-size: 0.85em; color: #5a8a6a; }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #4eca7a, #28a745); color: #fff; padding: 10px 24px;
  border-radius: 20px; font-size: 0.9em; opacity: 0; font-weight: 600;
  transition: opacity 0.3s; pointer-events: none; z-index: 200;
  box-shadow: 0 4px 14px rgba(40,167,69,0.3);
}
.toast.visible { opacity: 1; }

/* Responsive */
@media (max-width: 600px) {
  .page { padding: 24px 14px; }
  .index-topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
  .index-topbar-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .chapter-topbar { flex-wrap: wrap; gap: 8px; }
  .setup-actions { flex-direction: column; gap: 12px; }
  .setup-actions .btn-gold { width: 100%; }
  .index-bottom { flex-direction: column; }
  .index-bottom .btn-gold, .index-bottom .btn-secondary { width: 100%; text-align: center; }
  .story-card { padding: 16px; }
  .story-card-actions { margin-left: 8px; }
  .glass-header { padding: 20px 16px 18px; border-radius: 24px; }
  .new-story-inner { padding: 24px 16px; }
  .story-card-controls { gap: 6px; }
}
</style>
</head>
<body>

<!-- Home Page -->

<script>
const LORE_TEMPLATE = '';

const LORE_SECTIONS = ['characters', 'world', 'ships', 'canon', 'secrets'];
const LORE_HEADERS = {
  characters: '# Your Sims',
  world: '# Lot & Neighborhood',
  ships: '# Relationships',
  canon: '# Gameplay Rules',
  secrets: '# Sim Secrets'
};

function parseLore(loreStr) {
  const result = { characters: '', world: '', ships: '', canon: '', secrets: '' };
  if (!loreStr || !loreStr.trim()) return result;
  const sections = loreStr.split(/^# /m).filter(Boolean);
  sections.forEach(section => {
    const lines = section.split('\n');
    const header = lines[0].trim().toLowerCase();
    const body = lines.slice(1).join('\n').trim();
    if (header.startsWith('characters') || header.startsWith('your sims') || header.startsWith('sims')) result.characters = body;
    else if (header.startsWith('world') || header.startsWith('setting') || header.startsWith('lot') || header.startsWith('neighborhood')) result.world = body;
    else if (header.startsWith('ships') || header.startsWith('relationships')) result.ships = body;
    else if (header.startsWith('canon') || header.startsWith('gameplay')) result.canon = body;
    else if (header.startsWith('secrets') || header.startsWith('subtext') || header.startsWith('sim secrets')) result.secrets = body;
  });
  return result;
}

function composeLore(fields) {
  const parts = [];
  LORE_SECTIONS.forEach(key => {
    if (fields[key] && fields[key].trim()) {
      parts.push(LORE_HEADERS[key] + '\n' + fields[key].trim());
    }
  });
  return parts.join('\n\n');
}

function getLoreFieldsFromSetup() {
  return {
    characters: document.getElementById('inp-lore-characters').value,
    world: document.getElementById('inp-lore-world').value,
    ships: document.getElementById('inp-lore-ships').value,
    canon: document.getElementById('inp-lore-canon').value,
    secrets: document.getElementById('inp-lore-secrets').value
  };
}

function setLoreFieldsInSetup(fields) {
  document.getElementById('inp-lore-characters').value = fields.characters || '';
  document.getElementById('inp-lore-world').value = fields.world || '';
  document.getElementById('inp-lore-ships').value = fields.ships || '';
  document.getElementById('inp-lore-canon').value = fields.canon || '';
  document.getElementById('inp-lore-secrets').value = fields.secrets || '';
}

function getLoreFieldsFromEditor() {
  return {
    characters: document.getElementById('lore-edit-characters').value,
    world: document.getElementById('lore-edit-world').value,
    ships: document.getElementById('lore-edit-ships').value,
    canon: document.getElementById('lore-edit-canon').value,
    secrets: document.getElementById('lore-edit-secrets').value
  };
}

function setLoreFieldsInEditor(fields) {
  document.getElementById('lore-edit-characters').value = fields.characters || '';
  document.getElementById('lore-edit-world').value = fields.world || '';
  document.getElementById('lore-edit-ships').value = fields.ships || '';
  document.getElementById('lore-edit-canon').value = fields.canon || '';
  document.getElementById('lore-edit-secrets').value = fields.secrets || '';
}

const STORAGE_KEY = 'simfic_state';
const STORIES_KEY = 'simfic_stories';

function newStoryState() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title: '',
    fandom: '',
    packs: [],
    tone: 'Drama-filled legacy play',
    premise: '',
    lore: LORE_TEMPLATE,
    chapters: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

let stories = []; // Array of story objects
let state = {
  currentPage: 'home',
  activeStoryId: null,
  currentChapter: 0
};
let activeStory = null; // Reference to the current story in stories array

let editing = false;
let loreVisible = false;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  localStorage.setItem(STORIES_KEY, JSON.stringify(stories));
}

function loadState() {
  try {
    const savedState = localStorage.getItem(STORAGE_KEY);
    const savedStories = localStorage.getItem(STORIES_KEY);

    if (savedStories) {
      stories = JSON.parse(savedStories);
    }

    if (savedState) {
      const parsed = JSON.parse(savedState);
      // Migrate from old single-story format
      if (parsed.title !== undefined && !parsed.activeStoryId) {
        const migrated = newStoryState();
        migrated.title = parsed.title || '';
        migrated.fandom = parsed.fandom || '';
        migrated.packs = parsed.packs || [];
        migrated.tone = parsed.tone || 'Emotional but grounded';
        migrated.premise = parsed.premise || '';
        migrated.lore = parsed.lore || LORE_TEMPLATE;
        migrated.chapters = parsed.chapters || [];
        if (migrated.title) {
          stories.push(migrated);
          state.activeStoryId = migrated.id;
          state.currentPage = parsed.currentPage === 'setup' ? 'setup' : parsed.currentPage;
          state.currentChapter = parsed.currentChapter || 0;
        }
      } else {
        state = { ...state, ...parsed };
      }
    }

    // Resolve active story reference
    if (state.activeStoryId) {
      activeStory = stories.find(s => s.id === state.activeStoryId) || null;
    }
  } catch (e) { /* ignore parse errors */ }
}

function setActiveStory(storyId) {
  state.activeStoryId = storyId;
  activeStory = stories.find(s => s.id === storyId) || null;
}

function escapeHTML(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 2000);
}

function navigate(page, chapterIndex) {
  state.currentPage = page;
  if (chapterIndex !== undefined) state.currentChapter = chapterIndex;
  editing = false;
  saveState();
  render();
  window.scrollTo(0, 0);
}

// -- Render --
function render() {
  document.getElementById('home-page').classList.toggle('active', state.currentPage === 'home');
  document.getElementById('setup-page').classList.toggle('active', state.currentPage === 'setup');
  document.getElementById('index-page').classList.toggle('active', state.currentPage === 'index');
  document.getElementById('chapter-page').classList.toggle('active', state.currentPage === 'chapter');

  if (state.currentPage === 'home') renderHome();
  else if (state.currentPage === 'setup') renderSetup();
  else if (state.currentPage === 'index') renderIndex();
  else if (state.currentPage === 'chapter') renderChapter();
}

function renderHome() {
  const list = document.getElementById('stories-list');
  list.innerHTML = '';

  if (stories.length === 0) {
    list.innerHTML = '<div class="home-empty"><p>No stories yet. Create your first one below.</p></div>';
    return;
  }

  // Sort by most recently updated
  const sorted = [...stories].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  sorted.forEach(story => {
    const card = document.createElement('div');
    card.className = 'story-card';

    const info = document.createElement('div');
    info.className = 'story-card-info';
    info.addEventListener('click', () => {
      setActiveStory(story.id);
      navigate('index');
    });

    const title = document.createElement('div');
    title.className = 'story-card-title';
    title.textContent = story.title || 'Untitled Story';

    const tags = document.createElement('div');
    tags.className = 'story-card-tags';
    if (story.fandom) {
      const fandomTag = document.createElement('span');
      fandomTag.className = 'tag-fandom';
      fandomTag.textContent = '\u{1F48E} ' + story.fandom;
      tags.appendChild(fandomTag);
    }
    if (story.tone) {
      const toneTag = document.createElement('span');
      toneTag.className = 'tag-tone';
      toneTag.textContent = '\u2713 ' + story.tone;
      tags.appendChild(toneTag);
    }
    if (!story.fandom && !story.tone) {
      const emptyTag = document.createElement('span');
      emptyTag.className = 'tag-fandom';
      emptyTag.textContent = 'No game set';
      tags.appendChild(emptyTag);
    }

    const chapters = document.createElement('div');
    chapters.className = 'story-card-chapters';
    const count = story.chapters ? story.chapters.length : 0;
    chapters.textContent = count === 0 ? 'No chapters yet' : count === 1 ? '1 chapter' : `${count} chapters`;

    info.appendChild(title);
    info.appendChild(tags);
    info.appendChild(chapters);

    const actions = document.createElement('div');
    actions.className = 'story-card-actions';

    const editBtn = document.createElement('button');
    editBtn.title = 'Edit story settings';
    editBtn.textContent = '\u2699';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setActiveStory(story.id);
      navigate('setup');
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-story';
    deleteBtn.title = 'Delete story';
    deleteBtn.textContent = '\u2715';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm(`Delete "${story.title || 'Untitled Story'}"? This can't be undone.`)) return;
      stories = stories.filter(s => s.id !== story.id);
      if (state.activeStoryId === story.id) {
        state.activeStoryId = null;
        activeStory = null;
      }
      saveState();
      renderHome();
    });

    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);

    const chevron = document.createElement('button');
    chevron.className = 'story-card-chevron';
    chevron.textContent = '\u203A';
    chevron.addEventListener('click', (e) => {
      e.stopPropagation();
      setActiveStory(story.id);
      navigate('index');
    });

    const controls = document.createElement('div');
    controls.className = 'story-card-controls';
    controls.appendChild(actions);
    controls.appendChild(chevron);

    card.appendChild(info);
    card.appendChild(controls);
    list.appendChild(card);
  });
}

function renderSetup() {
  if (!activeStory) return;
  document.getElementById('inp-title').value = activeStory.title;
  document.getElementById('inp-fandom').value = activeStory.fandom;
  document.getElementById('inp-tone').value = activeStory.tone;
  document.getElementById('inp-premise').value = activeStory.premise;
  setLoreFieldsInSetup(parseLore(activeStory.lore));
  renderPackSelector();
  document.getElementById('setup-error').style.display = 'none';
}

function renderIndex() {
  if (!activeStory) { navigate('home'); return; }
  document.getElementById('index-title').textContent = activeStory.title;
  const fandomEl = document.getElementById('index-fandom');
  const packSummary = (activeStory.packs && activeStory.packs.length > 0) ? `+ ${activeStory.packs.length} packs` : '';
  fandomEl.textContent = [activeStory.fandom, packSummary, activeStory.tone].filter(Boolean).join(' · ');

  const hasChapters = activeStory.chapters.length > 0;
  document.getElementById('btn-export').style.display = hasChapters ? '' : 'none';
  document.getElementById('btn-copy-prompt').style.display = '';

  const list = document.getElementById('chapter-list');
  list.innerHTML = '';

  if (!hasChapters) {
    list.innerHTML = '<div class="empty-state">No chapters yet. Paste your first chapter to get started.</div>';
    return;
  }

  activeStory.chapters.forEach((text, i) => {
    const card = document.createElement('div');
    card.className = 'chapter-card';

    const content = document.createElement('div');
    content.className = 'chapter-card-content';
    content.innerHTML = `<div class="chapter-card-label">Chapter ${i + 1}</div><div class="chapter-card-preview">${escapeHTML(text.substring(0, 120))}</div>`;
    content.addEventListener('click', () => navigate('chapter', i));

    const arrows = document.createElement('div');
    arrows.className = 'chapter-card-arrows';
    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = i === 0;
    upBtn.addEventListener('click', (e) => { e.stopPropagation(); moveChapter(i, -1); });
    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = i === activeStory.chapters.length - 1;
    downBtn.addEventListener('click', (e) => { e.stopPropagation(); moveChapter(i, 1); });
    arrows.appendChild(upBtn);
    arrows.appendChild(downBtn);

    const chevron = document.createElement('span');
    chevron.className = 'chapter-card-chevron';
    chevron.textContent = '›';
    chevron.addEventListener('click', () => navigate('chapter', i));

    card.appendChild(content);
    card.appendChild(arrows);
    card.appendChild(chevron);
    list.appendChild(card);
  });

  // Lore editor
  const loreSection = document.getElementById('lore-editor-section');
  loreSection.style.display = loreVisible ? '' : 'none';
  if (loreVisible) {
    setLoreFieldsInEditor(parseLore(activeStory.lore));
  }
}

function renderChapter() {
  if (!activeStory) { navigate('home'); return; }
  const idx = state.currentChapter;
  const total = activeStory.chapters.length;
  const text = activeStory.chapters[idx] || '';

  document.getElementById('chapter-of-label').textContent = `Chapter ${idx + 1} of ${total}`;
  document.getElementById('chapter-heading-text').textContent = `Chapter ${idx + 1}`;
  document.getElementById('chapter-body-text').textContent = '';
  const bodyEl = document.getElementById('chapter-body-text');
  bodyEl.textContent = text;

  document.getElementById('chapter-display').style.display = editing ? 'none' : '';
  document.getElementById('chapter-edit-area').style.display = editing ? '' : 'none';
  if (editing) {
    document.getElementById('chapter-edit-textarea').value = text;
  }

  document.getElementById('page-counter').textContent = `${idx + 1} / ${total}`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === total - 1;
}

function moveChapter(index, direction) {
  if (!activeStory) return;
  const target = index + direction;
  if (target < 0 || target >= activeStory.chapters.length) return;
  [activeStory.chapters[index], activeStory.chapters[target]] = [activeStory.chapters[target], activeStory.chapters[index]];
  activeStory.updatedAt = Date.now();
  saveState();
  renderIndex();
}

function exportHTML() {
  if (!activeStory) return;
  const chaptersHTML = activeStory.chapters.map((text, i) => {
    const divider = i > 0 ? '<div style="text-align:center;color:#5a5040;margin:48px 0;font-size:1.2em;letter-spacing:8px;">&#10022; &#10022; &#10022;</div>' : '';
    return `${divider}<h2 style="text-align:center;font-family:'Cinzel',serif;font-size:0.85em;text-transform:uppercase;letter-spacing:3px;color:#e8d5b0;margin:40px 0 24px;">Chapter ${i + 1}</h2><div style="white-space:pre-wrap;font-size:0.98em;line-height:1.9;color:#c8bca3;">${escapeHTML(text)}</div>`;
  }).join('');

  const subtitle = [activeStory.fandom, activeStory.tone].filter(Boolean).join(' · ');
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${escapeHTML(activeStory.title)}</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><style>body{background:#1a1a1a;color:#d4c5a9;font-family:'Lora','Georgia',serif;max-width:700px;margin:0 auto;padding:48px 24px;}</style></head><body><h1 style="text-align:center;font-family:'Cinzel',serif;font-size:2em;color:#e8d5b0;margin-bottom:8px;">${escapeHTML(activeStory.title)}</h1>${subtitle ? `<p style="text-align:center;font-style:italic;color:#8a7d6b;margin-bottom:48px;">${escapeHTML(subtitle)}</p>` : ''}${chaptersHTML}<div style="text-align:center;color:#5a5040;margin-top:64px;font-size:0.82em;font-style:italic;">Written with SimFic</div></body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${activeStory.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'story'}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copyPrompt() {
  if (!activeStory) return;
  const nextChapter = activeStory.chapters.length + 1;
  let prompt = `Write Chapter ${nextChapter} of my story.\n\nSTORY: "${activeStory.title}"\n`;
  if (activeStory.fandom) prompt += `GAME: ${activeStory.fandom}\n`;
  if (activeStory.packs && activeStory.packs.length > 0) prompt += `PACKS: ${activeStory.packs.join(', ')}\n`;
  if (activeStory.tone) prompt += `TONE: ${activeStory.tone}\n`;
  prompt += `PREMISE: ${activeStory.premise}\n`;
  if (activeStory.lore.trim()) prompt += `\nSIM BIBLE:\n${activeStory.lore}\n`;

  if (activeStory.chapters.length > 0) {
    prompt += '\nPREVIOUS CHAPTERS:\n';
    activeStory.chapters.forEach((text, i) => {
      prompt += `--- Chapter ${i + 1} ---\n${text}\n`;
    });
    prompt += `\nContinue naturally from where the last chapter ended. Maintain voice consistency. Build on established threads. End on a turn. Write 800-1500 words.\n`;
  } else {
    prompt += `\nThis is the opening chapter. Drop in mid-action. Establish voice, characters, and tension. End on a moment that makes me need chapter 2. Write 800-1500 words.\n`;
  }

  prompt += '\nReturn ONLY the prose. No title, no author notes, no explanation.';

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(prompt).then(() => showToast('Copied!')).catch(() => fallbackCopy(prompt));
  } else {
    fallbackCopy(prompt);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('Copied!');
  } catch (e) {
    showToast('Failed to copy');
  }
  document.body.removeChild(ta);
}

function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

// Tag-aware picking: scores items by tag overlap, picks from top candidates
function pickTagged(arr, tagArr, n, preferTags) {
  if (!preferTags || preferTags.length === 0) return pickRandom(arr, n);
  const scored = arr.map((item, i) => {
    const itemTags = tagArr[i] || [];
    const overlap = itemTags.filter(t => preferTags.includes(t)).length;
    return { item, overlap, rand: Math.random() };
  });
  // Sort by overlap desc, then random
  scored.sort((a, b) => b.overlap - a.overlap || a.rand - b.rand);
  return scored.slice(0, n).map(s => s.item);
}

function getTagsForIndex(tagArr, index) {
  return (tagArr && tagArr[index]) ? tagArr[index] : [];
}

function getTagsForValue(arr, tagArr, value) {
  const idx = arr.indexOf(value);
  return idx >= 0 ? getTagsForIndex(tagArr, idx) : [];
}

function getActiveTags() {
  if (!activeStory) return [];
  const fandomTags = getTagsForValue(SAMPLE_FANDOMS, FANDOM_TAGS, activeStory.fandom);
  const toneTags = getTagsForValue(SAMPLE_TONES, TONE_TAGS, activeStory.tone);
  const packTags = (activeStory.packs || []).flatMap(name => {
    const pack = SIMS_PACKS.find(p => p.name === name);
    return pack ? pack.tags : [];
  });
  return [...new Set([...fandomTags, ...toneTags, ...packTags])];
}

function cascadeFillTone(tags) {
  const tone = pickTagged(SAMPLE_TONES, TONE_TAGS, 1, tags)[0];
  document.getElementById('inp-tone').value = tone;
  activeStory.tone = tone;
  return [...new Set([...tags, ...getTagsForValue(SAMPLE_TONES, TONE_TAGS, tone)])];
}

function cascadeFillPremise(tags) {
  const premise = pickTagged(SAMPLE_PREMISES, PREMISE_TAGS, 1, tags)[0];
  document.getElementById('inp-premise').value = premise;
  activeStory.premise = premise;
}

function cascadeFillLore(tags, target) {
  const fields = {
    characters: pickTagged(SAMPLE_CHARACTERS, CHARACTER_TAGS, 3, tags).join('\n\n'),
    world: pickTagged(SAMPLE_WORLDS, WORLD_TAGS, 1, tags)[0],
    ships: pickTagged(SAMPLE_SHIPS, SHIP_TAGS, 2, tags).join('\n\n'),
    canon: pickTagged(SAMPLE_CANON_RULES, CANON_TAGS, 3, tags).join('\n\n'),
    secrets: pickTagged(SAMPLE_SECRETS, SECRET_TAGS, 3, tags).join('\n\n')
  };
  if (target === 'setup') {
    setLoreFieldsInSetup(fields);
  } else {
    setLoreFieldsInEditor(fields);
  }
  activeStory.lore = composeLore(fields);
}

function generateSampleLore() {
  const world = pickRandom(SAMPLE_WORLDS, 1)[0];
  const chars = pickRandom(SAMPLE_CHARACTERS, 3);
  const ships = pickRandom(SAMPLE_SHIPS, 2);
  const rules = pickRandom(SAMPLE_CANON_RULES, 3);
  const secrets = pickRandom(SAMPLE_SECRETS, 3);

  return `# Your Sims\n${chars.join('\n\n')}\n\n# Lot & Neighborhood\n${world}\n\n# Relationships\n${ships.join('\n\n')}\n\n# Gameplay Rules\n${rules.join('\n\n')}\n\n# Sim Secrets\n${secrets.join('\n\n')}`;
}

// -- Pack Selector --
function renderPackSelector() {
  const container = document.getElementById('pack-selector');
  container.innerHTML = '';
  const selected = (activeStory && activeStory.packs) ? activeStory.packs : [];
  ['EP', 'GP'].forEach(type => {
    const packs = SIMS_PACKS.filter(p => p.type === type);
    const label = document.createElement('div');
    label.className = 'pack-group-label';
    const typeLabel = type === 'EP' ? 'Expansion Packs' : 'Game Packs';
    label.innerHTML = `<span>${typeLabel}</span>`;
    const selAllBtn = document.createElement('button');
    const allSelected = packs.every(p => selected.includes(p.name));
    selAllBtn.textContent = allSelected ? 'Deselect All' : 'Select All';
    selAllBtn.addEventListener('click', () => {
      if (!activeStory) return;
      const names = packs.map(p => p.name);
      if (allSelected) {
        activeStory.packs = activeStory.packs.filter(n => !names.includes(n));
      } else {
        activeStory.packs = [...new Set([...activeStory.packs, ...names])];
      }
      activeStory.updatedAt = Date.now();
      saveState();
      renderPackSelector();
    });
    label.appendChild(selAllBtn);
    container.appendChild(label);
    const chips = document.createElement('div');
    chips.className = 'pack-chips';
    packs.forEach(pack => {
      const chip = document.createElement('span');
      chip.className = 'pack-chip' + (selected.includes(pack.name) ? ' selected' : '');
      chip.textContent = pack.name;
      chip.addEventListener('click', () => {
        if (!activeStory) return;
        if (!activeStory.packs) activeStory.packs = [];
        const idx = activeStory.packs.indexOf(pack.name);
        if (idx >= 0) activeStory.packs.splice(idx, 1);
        else activeStory.packs.push(pack.name);
        activeStory.updatedAt = Date.now();
        saveState();
        renderPackSelector();
      });
      chips.appendChild(chip);
    });
    container.appendChild(chips);
  });
}

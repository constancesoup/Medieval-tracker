<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanfic Forge</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(160deg, #fff0f5 0%, #fce4ec 40%, #f8e8f0 100%);
  color: #5c3a4a;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.6;
  min-height: 100vh;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: #fce4ec; }
::-webkit-scrollbar-thumb { background: #f8a4c8; border-radius: 20px; }

.page { display: none; max-width: 720px; margin: 0 auto; padding: 40px 20px; }
.page.active { display: block; }

h1, h2, h3 { font-family: 'Quicksand', sans-serif; color: #d63384; }

label {
  display: block;
  font-size: 0.82em;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: #b06088;
  margin-bottom: 6px;
  font-weight: 600;
}

input[type="text"], textarea {
  width: 100%;
  background: #fff;
  border: 2px solid #f5c6d8;
  border-radius: 16px;
  color: #5c3a4a;
  font-family: 'Nunito', 'Segoe UI', sans-serif;
  font-size: 0.95em;
  line-height: 1.6;
  padding: 12px 16px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
input[type="text"]:focus, textarea:focus { border-color: #e91e90; box-shadow: 0 0 0 3px rgba(233,30,144,0.15); }
textarea { resize: vertical; }
input.sample-text, textarea.sample-text { color: #c9a0b4; font-style: italic; }

.field { margin-bottom: 20px; }

.btn-gold {
  background: linear-gradient(135deg, #f472b6, #e91e90);
  color: #fff;
  font-family: 'Quicksand', sans-serif;
  font-weight: 700;
  letter-spacing: 1px;
  border: none;
  border-radius: 24px;
  padding: 12px 28px;
  cursor: pointer;
  font-size: 0.95em;
  transition: filter 0.2s, transform 0.1s;
  box-shadow: 0 4px 14px rgba(233,30,144,0.25);
}
.btn-gold:hover { filter: brightness(1.1); transform: translateY(-1px); }
.btn-gold:disabled { opacity: 0.4; cursor: default; filter: none; transform: none; }

.btn-secondary {
  background: #fff;
  color: #d63384;
  border: 2px solid #f5c6d8;
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.9em;
  font-weight: 600;
  transition: background 0.2s, border-color 0.2s;
}
.btn-secondary:hover { background: #fce4ec; border-color: #f472b6; }

.btn-ghost {
  background: transparent;
  border: none;
  color: #d48aa8;
  cursor: pointer;
  font-size: 1.1em;
  padding: 4px 8px;
  transition: color 0.2s;
}
.btn-ghost:hover { color: #e91e90; }

.btn-danger {
  background: #fde2e2;
  color: #c0392b;
  border: 2px solid #f5a5a5;
  border-radius: 20px;
  padding: 8px 16px;
  cursor: pointer;
  font-family: 'Quicksand', sans-serif;
  font-size: 0.9em;
  font-weight: 600;
}
.btn-danger:hover { background: #fcc; border-color: #e74c3c; }

/* Home Page */
#home-page { padding-top: 60px; }
#home-page h1 { text-align: center; margin-bottom: 8px; font-size: 2em; }
.home-subtitle { text-align: center; color: #b06088; margin-bottom: 40px; font-style: italic; }

.story-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
.story-card {
  background: #fff;
  border: 2px solid #f5c6d8;
  border-radius: 20px;
  padding: 20px 24px;
  cursor: pointer;
  transition: border-color 0.2s, transform 0.1s, box-shadow 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 8px rgba(214,51,132,0.08);
}
.story-card:hover { border-color: #f472b6; transform: translateY(-2px); box-shadow: 0 6px 20px rgba(214,51,132,0.15); }
.story-card-info { flex: 1; min-width: 0; }
.story-card-title {
  font-family: 'Quicksand', sans-serif;
  font-size: 1.1em;
  font-weight: 700;
  color: #d63384;
  margin-bottom: 4px;
}
.story-card-meta {
  font-size: 0.82em;
  color: #b06088;
  font-style: italic;
}
.story-card-chapters {
  font-size: 0.8em;
  color: #d48aa8;
  margin-top: 6px;
}
.story-card-chevron { color: #d48aa8; font-size: 1.4em; margin-left: 16px; }
.story-card:hover .story-card-chevron { color: #e91e90; }

.story-card-actions { display: flex; gap: 4px; margin-left: 12px; }
.story-card-actions button {
  background: transparent;
  border: none;
  color: #d48aa8;
  cursor: pointer;
  font-size: 0.9em;
  padding: 4px 8px;
  border-radius: 12px;
  transition: color 0.2s, background 0.2s;
}
.story-card-actions button:hover { color: #e91e90; background: rgba(233,30,144,0.08); }
.story-card-actions .delete-story:hover { color: #c0392b; background: rgba(192,57,43,0.08); }

.new-story-section {
  border: 2px dashed #f5c6d8;
  border-radius: 20px;
  padding: 32px;
  text-align: center;
  transition: border-color 0.2s;
  background: rgba(255,255,255,0.5);
}
.new-story-section:hover { border-color: #f472b6; }
.new-story-section h3 {
  font-size: 1em;
  margin-bottom: 8px;
  color: #b06088;
}
.new-story-section p {
  font-size: 0.85em;
  color: #d48aa8;
  margin-bottom: 16px;
}

.home-empty {
  text-align: center;
  padding: 48px 20px;
  color: #d48aa8;
}
.home-empty p {
  font-style: italic;
  margin-bottom: 24px;
  font-size: 1.05em;
}

/* Setup Page */
#setup-page h1 { text-align: center; margin-bottom: 8px; font-size: 1.8em; }
.setup-subtitle { text-align: center; color: #b06088; margin-bottom: 36px; font-style: italic; }
.setup-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 32px; }
.validation-error { color: #e91e90; font-size: 0.85em; margin-top: 8px; }

/* Index Page */
.index-topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 28px; padding-bottom: 16px; border-bottom: 2px solid #f5c6d8;
}
.index-topbar-title h2 { font-size: 1.3em; margin-bottom: 2px; }
.index-topbar-title .fandom { font-size: 0.82em; color: #b06088; font-style: italic; }
.index-topbar-actions { display: flex; gap: 8px; align-items: center; }

.chapter-card {
  background: #fff;
  border: 2px solid #f5c6d8;
  border-radius: 18px;
  padding: 16px 20px;
  margin-bottom: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  transition: border-color 0.2s, box-shadow 0.2s;
  box-shadow: 0 2px 8px rgba(214,51,132,0.06);
}
.chapter-card:hover { border-color: #f472b6; box-shadow: 0 4px 14px rgba(214,51,132,0.12); }
.chapter-card-content { flex: 1; min-width: 0; }
.chapter-card-label { font-size: 0.95em; font-weight: 700; color: #e91e90; margin-bottom: 4px; }
.chapter-card-preview { font-size: 0.85em; color: #b06088; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chapter-card-arrows { display: flex; flex-direction: column; gap: 2px; margin: 0 12px; }
.chapter-card-arrows button {
  background: transparent; border: none; color: #d48aa8; cursor: pointer;
  font-size: 0.9em; padding: 2px 6px; line-height: 1;
}
.chapter-card-arrows button:hover { color: #e91e90; }
.chapter-card-arrows button:disabled { opacity: 0.2; cursor: default; }
.chapter-card-chevron { color: #d48aa8; font-size: 1.2em; margin-left: 8px; }

.empty-state { text-align: center; color: #d48aa8; padding: 48px 20px; font-style: italic; }

.index-bottom { margin-top: 24px; display: flex; flex-wrap: wrap; gap: 10px; }

.lore-editor { margin-top: 20px; padding-top: 20px; border-top: 2px solid #f5c6d8; }
.lore-editor textarea { min-height: 200px; }
.lore-toggle { cursor: pointer; color: #b06088; font-size: 0.9em; }
.lore-toggle:hover { color: #e91e90; }

/* Add Chapter Modal */
.modal-overlay {
  display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(214,51,132,0.15); backdrop-filter: blur(4px); z-index: 100; align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: #fff; border: 2px solid #f5c6d8; border-radius: 24px;
  padding: 28px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 32px rgba(214,51,132,0.15);
}
.modal h3 { margin-bottom: 16px; font-size: 1.1em; }
.modal textarea { min-height: 300px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; }

/* Chapter View */
.chapter-topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 32px; padding-bottom: 16px; border-bottom: 2px solid #f5c6d8;
}
.chapter-topbar-center { font-size: 0.82em; text-transform: uppercase; letter-spacing: 1.5px; color: #b06088; }
.chapter-topbar-actions { display: flex; gap: 8px; }

.chapter-heading {
  text-align: center; font-size: 0.85em; text-transform: uppercase;
  letter-spacing: 3px; color: #d63384; margin-bottom: 32px;
  font-family: 'Quicksand', sans-serif; font-weight: 700;
}
.chapter-body {
  white-space: pre-wrap; font-size: 0.98em; line-height: 1.9;
  color: #5c3a4a; padding-bottom: 80px;
}

.chapter-edit textarea { min-height: 400px; margin-bottom: 16px; }
.chapter-edit-actions { display: flex; gap: 10px; margin-bottom: 32px; }

.chapter-bottombar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #fff; border-top: 2px solid #f5c6d8;
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 24px; z-index: 50;
  box-shadow: 0 -2px 12px rgba(214,51,132,0.08);
}
.chapter-bottombar .page-counter { font-size: 0.85em; color: #b06088; }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg, #f472b6, #e91e90); color: #fff; padding: 10px 24px;
  border-radius: 20px; font-size: 0.9em; opacity: 0; font-weight: 600;
  transition: opacity 0.3s; pointer-events: none; z-index: 200;
  box-shadow: 0 4px 14px rgba(233,30,144,0.3);
}
.toast.visible { opacity: 1; }

/* Responsive */
@media (max-width: 600px) {
  .page { padding: 24px 14px; }
  .index-topbar { flex-direction: column; align-items: flex-start; gap: 12px; }
  .index-topbar-actions { width: 100%; justify-content: flex-start; flex-wrap: wrap; }
  .chapter-topbar { flex-wrap: wrap; gap: 8px; }
  .setup-actions { flex-direction: column; gap: 12px; }
  .setup-actions .btn-gold { width: 100%; }
  .index-bottom { flex-direction: column; }
  .index-bottom .btn-gold, .index-bottom .btn-secondary { width: 100%; text-align: center; }
  .story-card { padding: 16px; }
  .story-card-actions { margin-left: 8px; }
}
</style>
</head>
<body>

<!-- Home Page -->
<div id="home-page" class="page">
  <h1>Fanfic Forge</h1>
  <p class="home-subtitle">Your fanfiction writing workshop</p>
  <div id="stories-list" class="story-grid"></div>
  <div class="new-story-section">
    <h3>Start a New Story</h3>
    <p>Set up your title, premise, lore bible, and begin writing</p>
    <button class="btn-gold" id="btn-new-story">+ New Story</button>
  </div>
</div>

<!-- Setup Page -->
<div id="setup-page" class="page">
  <h1>Fanfic Forge</h1>
  <p class="setup-subtitle">Story Setup</p>
  <div class="field">
    <label for="inp-title">Story Title *</label>
    <input type="text" id="inp-title" placeholder="Enter your story title">
  </div>
  <div class="field">
    <label for="inp-fandom">Fandom / Universe</label>
    <input type="text" id="inp-fandom" placeholder="e.g. Harry Potter, ATLA, Original">
  </div>
  <div class="field">
    <label for="inp-tone">Tone / Vibe</label>
    <input type="text" id="inp-tone" placeholder="Emotional but grounded">
  </div>
  <div class="field">
    <label for="inp-premise">Premise *</label>
    <textarea id="inp-premise" rows="4" placeholder="What's this story about?"></textarea>
  </div>
  <div class="field">
    <label for="inp-lore">Lore Bible</label>
    <button class="btn-secondary" id="btn-fill-sample" type="button" style="float:right;margin-top:-24px;">Fill with Sample</button>
    <textarea id="inp-lore" rows="8"></textarea>
  </div>
  <div id="setup-error" class="validation-error" style="display:none;"></div>
  <div class="setup-actions">
    <button class="btn-secondary" id="btn-reset" type="button">&larr; All Stories</button>
    <button class="btn-gold" id="btn-begin" type="button">Begin Writing</button>
  </div>
</div>

<!-- Index Page -->
<div id="index-page" class="page">
  <div class="index-topbar">
    <div class="index-topbar-title">
      <h2 id="index-title"></h2>
      <span class="fandom" id="index-fandom"></span>
    </div>
    <div class="index-topbar-actions">
      <button class="btn-ghost" id="btn-home" title="All Stories">&#8962;</button>
      <button class="btn-ghost" id="btn-settings" title="Settings">&#9881;</button>
      <button class="btn-secondary" id="btn-copy-prompt" style="display:none;">Copy Prompt for Claude</button>
      <button class="btn-gold" id="btn-export" style="display:none;">Export HTML</button>
    </div>
  </div>
  <div id="chapter-list"></div>
  <div class="index-bottom">
    <button class="btn-gold" id="btn-add-chapter">+ Add Chapter</button>
    <button class="btn-secondary" id="btn-lore-toggle">Edit Lore Bible</button>
  </div>
  <div id="lore-editor-section" class="lore-editor" style="display:none;">
    <label for="lore-edit-area">Lore Bible</label>
    <textarea id="lore-edit-area" rows="8"></textarea>
  </div>
</div>

<!-- Chapter View Page -->
<div id="chapter-page" class="page">
  <div class="chapter-topbar">
    <button class="btn-secondary" id="btn-back-index">&larr; Index</button>
    <span class="chapter-topbar-center" id="chapter-of-label"></span>
    <div class="chapter-topbar-actions">
      <button class="btn-ghost" id="btn-edit-chapter" title="Edit">&#9998;</button>
      <button class="btn-ghost" id="btn-delete-chapter" title="Delete" style="color:#6b3a3a;">&#10005;</button>
    </div>
  </div>
  <div id="chapter-display">
    <div class="chapter-heading" id="chapter-heading-text"></div>
    <div class="chapter-body" id="chapter-body-text"></div>
  </div>
  <div id="chapter-edit-area" class="chapter-edit" style="display:none;">
    <textarea id="chapter-edit-textarea"></textarea>
    <div class="chapter-edit-actions">
      <button class="btn-gold" id="btn-save-edit">Save</button>
      <button class="btn-secondary" id="btn-cancel-edit">Cancel</button>
    </div>
  </div>
  <div class="chapter-bottombar">
    <button class="btn-secondary" id="btn-prev">&larr; Prev</button>
    <span class="page-counter" id="page-counter"></span>
    <button class="btn-secondary" id="btn-next">Next &rarr;</button>
  </div>
</div>

<!-- Add Chapter Modal -->
<div class="modal-overlay" id="add-chapter-modal">
  <div class="modal">
    <h3>Add Chapter</h3>
    <textarea id="new-chapter-text" placeholder="Paste your chapter here..."></textarea>
    <div class="modal-actions">
      <button class="btn-secondary" id="btn-cancel-add">Cancel</button>
      <button class="btn-gold" id="btn-save-add">Save Chapter</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const LORE_TEMPLATE = `# Characters
(Name, age, personality, secrets, relationships)

# World / Setting
(World, rules, locations, time period)

# Ships / Relationships
(Who's with who? Dynamic? Tension?)

# Canon Rules
(What canon must be respected? What are you changing?)

# Secrets & Subtext
(What do characters know that others don't?)`;

const STORAGE_KEY = 'fanfic_forge_state';
const STORIES_KEY = 'fanfic_forge_stories';

function newStoryState() {
  return {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    title: '',
    fandom: '',
    tone: 'Emotional but grounded',
    premise: '',
    lore: LORE_TEMPLATE,
    chapters: [],
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
}

let stories = []; // Array of story objects
let state = {
  currentPage: 'home',
  activeStoryId: null,
  currentChapter: 0
};
let activeStory = null; // Reference to the current story in stories array

let editing = false;
let loreVisible = false;

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  localStorage.setItem(STORIES_KEY, JSON.stringify(stories));
}

function loadState() {
  try {
    const savedState = localStorage.getItem(STORAGE_KEY);
    const savedStories = localStorage.getItem(STORIES_KEY);

    if (savedStories) {
      stories = JSON.parse(savedStories);
    }

    if (savedState) {
      const parsed = JSON.parse(savedState);
      // Migrate from old single-story format
      if (parsed.title !== undefined && !parsed.activeStoryId) {
        const migrated = newStoryState();
        migrated.title = parsed.title || '';
        migrated.fandom = parsed.fandom || '';
        migrated.tone = parsed.tone || 'Emotional but grounded';
        migrated.premise = parsed.premise || '';
        migrated.lore = parsed.lore || LORE_TEMPLATE;
        migrated.chapters = parsed.chapters || [];
        if (migrated.title) {
          stories.push(migrated);
          state.activeStoryId = migrated.id;
          state.currentPage = parsed.currentPage === 'setup' ? 'setup' : parsed.currentPage;
          state.currentChapter = parsed.currentChapter || 0;
        }
      } else {
        state = { ...state, ...parsed };
      }
    }

    // Resolve active story reference
    if (state.activeStoryId) {
      activeStory = stories.find(s => s.id === state.activeStoryId) || null;
    }
  } catch (e) { /* ignore parse errors */ }
}

function setActiveStory(storyId) {
  state.activeStoryId = storyId;
  activeStory = stories.find(s => s.id === storyId) || null;
}

function escapeHTML(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(message) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 2000);
}

function navigate(page, chapterIndex) {
  state.currentPage = page;
  if (chapterIndex !== undefined) state.currentChapter = chapterIndex;
  editing = false;
  saveState();
  render();
  window.scrollTo(0, 0);
}

// -- Render --
function render() {
  document.getElementById('home-page').classList.toggle('active', state.currentPage === 'home');
  document.getElementById('setup-page').classList.toggle('active', state.currentPage === 'setup');
  document.getElementById('index-page').classList.toggle('active', state.currentPage === 'index');
  document.getElementById('chapter-page').classList.toggle('active', state.currentPage === 'chapter');

  if (state.currentPage === 'home') renderHome();
  else if (state.currentPage === 'setup') renderSetup();
  else if (state.currentPage === 'index') renderIndex();
  else if (state.currentPage === 'chapter') renderChapter();
}

function renderHome() {
  const list = document.getElementById('stories-list');
  list.innerHTML = '';

  if (stories.length === 0) {
    list.innerHTML = '<div class="home-empty"><p>No stories yet. Create your first one below.</p></div>';
    return;
  }

  // Sort by most recently updated
  const sorted = [...stories].sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));

  sorted.forEach(story => {
    const card = document.createElement('div');
    card.className = 'story-card';

    const info = document.createElement('div');
    info.className = 'story-card-info';
    info.addEventListener('click', () => {
      setActiveStory(story.id);
      navigate('index');
    });

    const title = document.createElement('div');
    title.className = 'story-card-title';
    title.textContent = story.title || 'Untitled Story';

    const meta = document.createElement('div');
    meta.className = 'story-card-meta';
    meta.textContent = [story.fandom, story.tone].filter(Boolean).join(' · ') || 'No fandom set';

    const chapters = document.createElement('div');
    chapters.className = 'story-card-chapters';
    const count = story.chapters ? story.chapters.length : 0;
    chapters.textContent = count === 0 ? 'No chapters yet' : count === 1 ? '1 chapter' : `${count} chapters`;

    info.appendChild(title);
    info.appendChild(meta);
    info.appendChild(chapters);

    const actions = document.createElement('div');
    actions.className = 'story-card-actions';

    const editBtn = document.createElement('button');
    editBtn.title = 'Edit story settings';
    editBtn.textContent = '\u2699';
    editBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      setActiveStory(story.id);
      navigate('setup');
    });

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-story';
    deleteBtn.title = 'Delete story';
    deleteBtn.textContent = '\u2715';
    deleteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!confirm(`Delete "${story.title || 'Untitled Story'}"? This can't be undone.`)) return;
      stories = stories.filter(s => s.id !== story.id);
      if (state.activeStoryId === story.id) {
        state.activeStoryId = null;
        activeStory = null;
      }
      saveState();
      renderHome();
    });

    actions.appendChild(editBtn);
    actions.appendChild(deleteBtn);

    const chevron = document.createElement('span');
    chevron.className = 'story-card-chevron';
    chevron.textContent = '\u203A';
    chevron.addEventListener('click', () => {
      setActiveStory(story.id);
      navigate('index');
    });

    card.appendChild(info);
    card.appendChild(actions);
    card.appendChild(chevron);
    list.appendChild(card);
  });
}

function renderSetup() {
  if (!activeStory) return;
  document.getElementById('inp-title').value = activeStory.title;
  document.getElementById('inp-fandom').value = activeStory.fandom;
  document.getElementById('inp-tone').value = activeStory.tone;
  document.getElementById('inp-premise').value = activeStory.premise;
  document.getElementById('inp-lore').value = activeStory.lore;
  document.getElementById('setup-error').style.display = 'none';
}

function renderIndex() {
  if (!activeStory) { navigate('home'); return; }
  document.getElementById('index-title').textContent = activeStory.title;
  const fandomEl = document.getElementById('index-fandom');
  fandomEl.textContent = [activeStory.fandom, activeStory.tone].filter(Boolean).join(' · ');

  const hasChapters = activeStory.chapters.length > 0;
  document.getElementById('btn-export').style.display = hasChapters ? '' : 'none';
  document.getElementById('btn-copy-prompt').style.display = '';

  const list = document.getElementById('chapter-list');
  list.innerHTML = '';

  if (!hasChapters) {
    list.innerHTML = '<div class="empty-state">No chapters yet. Paste your first chapter to get started.</div>';
    return;
  }

  activeStory.chapters.forEach((text, i) => {
    const card = document.createElement('div');
    card.className = 'chapter-card';

    const content = document.createElement('div');
    content.className = 'chapter-card-content';
    content.innerHTML = `<div class="chapter-card-label">Chapter ${i + 1}</div><div class="chapter-card-preview">${escapeHTML(text.substring(0, 120))}</div>`;
    content.addEventListener('click', () => navigate('chapter', i));

    const arrows = document.createElement('div');
    arrows.className = 'chapter-card-arrows';
    const upBtn = document.createElement('button');
    upBtn.textContent = '↑';
    upBtn.disabled = i === 0;
    upBtn.addEventListener('click', (e) => { e.stopPropagation(); moveChapter(i, -1); });
    const downBtn = document.createElement('button');
    downBtn.textContent = '↓';
    downBtn.disabled = i === activeStory.chapters.length - 1;
    downBtn.addEventListener('click', (e) => { e.stopPropagation(); moveChapter(i, 1); });
    arrows.appendChild(upBtn);
    arrows.appendChild(downBtn);

    const chevron = document.createElement('span');
    chevron.className = 'chapter-card-chevron';
    chevron.textContent = '›';
    chevron.addEventListener('click', () => navigate('chapter', i));

    card.appendChild(content);
    card.appendChild(arrows);
    card.appendChild(chevron);
    list.appendChild(card);
  });

  // Lore editor
  const loreSection = document.getElementById('lore-editor-section');
  loreSection.style.display = loreVisible ? '' : 'none';
  if (loreVisible) {
    document.getElementById('lore-edit-area').value = activeStory.lore;
  }
}

function renderChapter() {
  if (!activeStory) { navigate('home'); return; }
  const idx = state.currentChapter;
  const total = activeStory.chapters.length;
  const text = activeStory.chapters[idx] || '';

  document.getElementById('chapter-of-label').textContent = `Chapter ${idx + 1} of ${total}`;
  document.getElementById('chapter-heading-text').textContent = `Chapter ${idx + 1}`;
  document.getElementById('chapter-body-text').textContent = '';
  const bodyEl = document.getElementById('chapter-body-text');
  bodyEl.textContent = text;

  document.getElementById('chapter-display').style.display = editing ? 'none' : '';
  document.getElementById('chapter-edit-area').style.display = editing ? '' : 'none';
  if (editing) {
    document.getElementById('chapter-edit-textarea').value = text;
  }

  document.getElementById('page-counter').textContent = `${idx + 1} / ${total}`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === total - 1;
}

function moveChapter(index, direction) {
  if (!activeStory) return;
  const target = index + direction;
  if (target < 0 || target >= activeStory.chapters.length) return;
  [activeStory.chapters[index], activeStory.chapters[target]] = [activeStory.chapters[target], activeStory.chapters[index]];
  activeStory.updatedAt = Date.now();
  saveState();
  renderIndex();
}

function exportHTML() {
  if (!activeStory) return;
  const chaptersHTML = activeStory.chapters.map((text, i) => {
    const divider = i > 0 ? '<div style="text-align:center;color:#5a5040;margin:48px 0;font-size:1.2em;letter-spacing:8px;">&#10022; &#10022; &#10022;</div>' : '';
    return `${divider}<h2 style="text-align:center;font-family:'Cinzel',serif;font-size:0.85em;text-transform:uppercase;letter-spacing:3px;color:#e8d5b0;margin:40px 0 24px;">Chapter ${i + 1}</h2><div style="white-space:pre-wrap;font-size:0.98em;line-height:1.9;color:#c8bca3;">${escapeHTML(text)}</div>`;
  }).join('');

  const subtitle = [activeStory.fandom, activeStory.tone].filter(Boolean).join(' · ');
  const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>${escapeHTML(activeStory.title)}</title><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet"><style>body{background:#1a1a1a;color:#d4c5a9;font-family:'Lora','Georgia',serif;max-width:700px;margin:0 auto;padding:48px 24px;}</style></head><body><h1 style="text-align:center;font-family:'Cinzel',serif;font-size:2em;color:#e8d5b0;margin-bottom:8px;">${escapeHTML(activeStory.title)}</h1>${subtitle ? `<p style="text-align:center;font-style:italic;color:#8a7d6b;margin-bottom:48px;">${escapeHTML(subtitle)}</p>` : ''}${chaptersHTML}<div style="text-align:center;color:#5a5040;margin-top:64px;font-size:0.82em;font-style:italic;">Written with Fanfic Forge</div></body></html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${activeStory.title.replace(/[^a-z0-9]/gi, '_').toLowerCase() || 'story'}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function copyPrompt() {
  if (!activeStory) return;
  const nextChapter = activeStory.chapters.length + 1;
  let prompt = `Write Chapter ${nextChapter} of my story.\n\nSTORY: "${activeStory.title}"\n`;
  if (activeStory.fandom) prompt += `FANDOM: ${activeStory.fandom}\n`;
  if (activeStory.tone) prompt += `TONE: ${activeStory.tone}\n`;
  prompt += `PREMISE: ${activeStory.premise}\n`;
  if (activeStory.lore.trim()) prompt += `\nLORE BIBLE:\n${activeStory.lore}\n`;

  if (activeStory.chapters.length > 0) {
    prompt += '\nPREVIOUS CHAPTERS:\n';
    activeStory.chapters.forEach((text, i) => {
      prompt += `--- Chapter ${i + 1} ---\n${text}\n`;
    });
    prompt += `\nContinue naturally from where the last chapter ended. Maintain voice consistency. Build on established threads. End on a turn. Write 800-1500 words.\n`;
  } else {
    prompt += `\nThis is the opening chapter. Drop in mid-action. Establish voice, characters, and tension. End on a moment that makes me need chapter 2. Write 800-1500 words.\n`;
  }

  prompt += '\nReturn ONLY the prose. No title, no author notes, no explanation.';

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(prompt).then(() => showToast('Copied!')).catch(() => fallbackCopy(prompt));
  } else {
    fallbackCopy(prompt);
  }
}

function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('Copied!');
  } catch (e) {
    showToast('Failed to copy');
  }
  document.body.removeChild(ta);
}

['inp-title', 'inp-fandom', 'inp-tone', 'inp-premise', 'inp-lore'].forEach(id => {

document.getElementById('btn-copy-prompt').addEventListener('click', copyPrompt);

  document.getElementById('add-chapter-modal').classList.add('active');
});

document.getElementById('btn-cancel-add').addEventListener('click', () => {
  document.getElementById('add-chapter-modal').classList.remove('active');
});

document.getElementById('btn-save-add').addEventListener('click', () => {
  if (!activeStory) return;
  const text = document.getElementById('new-chapter-text').value.trim();
  if (!text) return;
  activeStory.chapters.push(text);
  activeStory.updatedAt = Date.now();
  saveState();
  document.getElementById('add-chapter-modal').classList.remove('active');
  renderIndex();
});

  renderIndex();
});

  activeStory.updatedAt = Date.now();
  saveState();
});

// Chapter View
document.getElementById('btn-back-index').addEventListener('click', () => navigate('index'));

document.getElementById('btn-edit-chapter').addEventListener('click', () => {
  editing = true;
  renderChapter();
});

document.getElementById('btn-save-edit').addEventListener('click', () => {
  if (!activeStory) return;
  const text = document.getElementById('chapter-edit-textarea').value.trim();
  if (text) {
    activeStory.chapters[state.currentChapter] = text;
    activeStory.updatedAt = Date.now();
    saveState();
  }
  editing = false;
  renderChapter();
});

document.getElementById('btn-cancel-edit').addEventListener('click', () => {
  editing = false;
  renderChapter();
});

document.getElementById('btn-delete-chapter').addEventListener('click', () => {
  if (!activeStory) return;
  const idx = state.currentChapter;
  if (!confirm(`Delete Chapter ${idx + 1}? This can't be undone.`)) return;
  activeStory.chapters.splice(idx, 1);
  activeStory.updatedAt = Date.now();
  if (activeStory.chapters.length === 0) {
    navigate('index');
  } else {
    state.currentChapter = Math.min(idx, activeStory.chapters.length - 1);
    saveState();
    renderChapter();
    document.getElementById('chapter-of-label').textContent = `Chapter ${state.currentChapter + 1} of ${activeStory.chapters.length}`;
  }
});

document.getElementById('btn-prev').addEventListener('click', () => {
  if (state.currentChapter > 0) navigate('chapter', state.currentChapter - 1);
});

document.getElementById('btn-next').addEventListener('click', () => {
  if (activeStory && state.currentChapter < activeStory.chapters.length - 1) navigate('chapter', state.currentChapter + 1);
});

// Close modal on overlay click
document.getElementById('add-chapter-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('active');
});

function pickRandom(arr, n) {
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function generateSampleLore() {
  const world = pickRandom(SAMPLE_WORLDS, 1)[0];
  const chars = pickRandom(SAMPLE_CHARACTERS, 3);
  const ships = pickRandom(SAMPLE_SHIPS, 2);
  const rules = pickRandom(SAMPLE_CANON_RULES, 3);
  const secrets = pickRandom(SAMPLE_SECRETS, 3);

  return `# Characters\n${chars.join('\n\n')}\n\n# World / Setting\n${world}\n\n# Ships / Relationships\n${ships.join('\n\n')}\n\n# Canon Rules\n${rules.join('\n\n')}\n\n# Secrets & Subtext\n${secrets.join('\n\n')}`;
}

// Fill Sample button handler
document.getElementById('btn-fill-sample').addEventListener('click', () => {
  if (!activeStory) return;
  const loreArea = document.getElementById('inp-lore');
  loreArea.value = generateSampleLore();
  loreArea.classList.remove('sample-text');
  activeStory.lore = loreArea.value;
  activeStory.updatedAt = Date.now();
  saveState();
  showToast('Sample lore generated!');
});

// Home page - New Story
document.getElementById('btn-new-story').addEventListener('click', () => {
  const story = newStoryState();
  stories.push(story);
  setActiveStory(story.id);
  navigate('setup');
});

// Index page - navigation
document.getElementById('btn-home').addEventListener('click', () => {
  state.activeStoryId = null;
  activeStory = null;

});

document.getElementById('btn-settings').addEventListener('click', () => {
  if (activeStory) navigate('setup');
});

// Init
loadState();
render();
